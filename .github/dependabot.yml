# Weekly dependency updates as PRs into develop, grouped so they arrive as a few PRs.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*", "com.google.devtools.ksp*"]
      build-tools:
        patterns: ["com.android.*", "com.diffplug.spotless*"]
      others:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
