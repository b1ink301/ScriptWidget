name: Release

# Push a tag like v0.2.0 to build signed APKs (per ABI + universal) and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          if ! [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 (got $GITHUB_REF_NAME)"; exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SCRIPTWIDGET_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret SCRIPTWIDGET_KEYSTORE_BASE64 is missing (see README > 릴리스 서명 > CI)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SCRIPTWIDGET_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew test

      - name: Signed release APKs
        env:
          SCRIPTWIDGET_KEYSTORE_PASSWORD: ${{ secrets.SCRIPTWIDGET_KEYSTORE_PASSWORD }}
          SCRIPTWIDGET_KEY_ALIAS: ${{ secrets.SCRIPTWIDGET_KEY_ALIAS }}
          SCRIPTWIDGET_KEY_PASSWORD: ${{ secrets.SCRIPTWIDGET_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}

      - name: Name, verify and checksum APKs
        run: |
          mkdir dist
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "dist/ScriptWidget-${{ steps.version.outputs.name }}-$abi.apk"
          done
          ls dist/*.apk >/dev/null 2>&1 || { echo "::error::No signed APKs were built"; exit 1; }
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for apk in dist/*.apk; do "$apksigner" verify "$apk"; done
          "$apksigner" verify --print-certs dist/*-universal.apk | grep -i "SHA-256"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/release.jks"

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.name, '-') }}
          body: |
            ## 설치
            - 대부분의 휴대폰: `ScriptWidget-${{ steps.version.outputs.name }}-arm64-v8a.apk`
            - 잘 모르겠으면: `-universal.apk` (모든 기기, 용량이 큼)
            - 처음 설치할 때 "출처를 알 수 없는 앱" 설치를 허용해야 합니다.
            - 무결성 확인: `SHA256SUMS.txt`
